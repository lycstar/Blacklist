name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 日常构建:push main / PR / 手动触发,产出 debug APK 构件
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Blacklist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # 发版:推送 v* 标签时构建并创建 GitHub Release(标题含版本号与日期)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and date
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          BUILD_DATE=$(date +%Y-%m-%d)
          APK_NAME="Blacklist-v${VERSION}-${BUILD_DATE}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本: v${VERSION} / 日期: ${BUILD_DATE} / 文件: ${APK_NAME}"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.meta.outputs.apk }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blacklist-release-apk
          path: ${{ steps.meta.outputs.apk }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.meta.outputs.apk }}" \
            --title "v${{ steps.meta.outputs.version }} · ${{ steps.meta.outputs.date }}" \
            --latest \
            --notes "构建日期:${{ steps.meta.outputs.date }}
          应用版本:v${{ steps.meta.outputs.version }}(debug 签名,可直接安装)
          提交:${{ github.sha }}"
